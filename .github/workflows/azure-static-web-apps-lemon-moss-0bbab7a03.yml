name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Load Static Web App settings
        shell: bash
        run: |
          echo "VITE_EXPENSE_TRACKER_API_BASE_URL=$(az staticwebapp appsettings list --name \"${{ vars.AZURE_STATIC_WEB_APP_NAME }}\" --resource-group \"${{ vars.AZURE_RESOURCE_GROUP }}\" --query \"properties.VITE_EXPENSE_TRACKER_API_BASE_URL\" -o tsv)" >> "$GITHUB_ENV"
          echo "VITE_MSAL_CLIENT_ID=$(az staticwebapp appsettings list --name \"${{ vars.AZURE_STATIC_WEB_APP_NAME }}\" --resource-group \"${{ vars.AZURE_RESOURCE_GROUP }}\" --query \"properties.VITE_MSAL_CLIENT_ID\" -o tsv)" >> "$GITHUB_ENV"
          echo "VITE_MSAL_TENANT_ID=$(az staticwebapp appsettings list --name \"${{ vars.AZURE_STATIC_WEB_APP_NAME }}\" --resource-group \"${{ vars.AZURE_RESOURCE_GROUP }}\" --query \"properties.VITE_MSAL_TENANT_ID\" -o tsv)" >> "$GITHUB_ENV"
          echo "VITE_MSAL_API_SCOPE=$(az staticwebapp appsettings list --name \"${{ vars.AZURE_STATIC_WEB_APP_NAME }}\" --resource-group \"${{ vars.AZURE_RESOURCE_GROUP }}\" --query \"properties.VITE_MSAL_API_SCOPE\" -o tsv)" >> "$GITHUB_ENV"
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_EXPENSE_TRACKER_API_BASE_URL: ${{ env.VITE_EXPENSE_TRACKER_API_BASE_URL }}
          VITE_MSAL_CLIENT_ID: ${{ env.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ env.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_API_SCOPE: ${{ env.VITE_MSAL_API_SCOPE }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MOSS_0BBAB7A03 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "app" # Frontend source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Vite build output directory
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MOSS_0BBAB7A03 }}
          action: "close"
          app_location: "app"
