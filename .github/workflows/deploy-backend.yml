# Docs for the Azure Functions action: https://github.com/Azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Required repository configuration:
#   secrets: AZUREAPPSERVICE_PUBLISHPROFILE_* (publish profile of the Function App, created by Azure Deployment Center)
#   vars (optional): AZURE_FUNCTIONAPP_NAME (Function App name, defaults to ExpenseTracker-Functions)
# Platform CORS is managed by the infrastructure template (infra/modules/functionApp.bicep), not here.

name: Deploy Backend (Azure Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME || 'ExpenseTracker-Functions' }}
  FUNCTIONS_PROJECT_PATH: ./api/RDS.ExpenseTracker.Functions/RDS.ExpenseTracker.Functions.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        run: dotnet build ./api/RDS.ExpenseTracker.sln --configuration Release

      - name: Publish Functions project
        run: dotnet publish ${{ env.FUNCTIONS_PROJECT_PATH }} --configuration Release --output "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: functions-app
          path: ${{ github.workspace }}/publish
          include-hidden-files: true # keeps the .azurefunctions folder generated by the worker SDK

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: functions-app
          path: ${{ github.workspace }}/publish

      - name: Deploy to Azure Functions
        id: deploy-to-functionapp
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          sku: flexconsumption # Flex Consumption plan: uses One Deploy instead of Kudu zipdeploy, no slots
          package: ${{ github.workspace }}/publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_329BA85C08F947248EE90BF122772B77 }}
