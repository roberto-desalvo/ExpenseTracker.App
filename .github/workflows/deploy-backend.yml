# Docs for the Azure Functions action: https://github.com/Azure/functions-action
#
# No app-specific configuration: the deploy job logs in with the same OIDC identity as deploy-infra.yml
# (environment "production": secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID, variable
# AZURE_RESOURCE_GROUP) and reads the Function App name from the outputs of the last infrastructure deploy.
# Platform CORS and app settings are managed by the infrastructure template, not here.
# EF Core migrations are applied by deploy-database.yml (called below) before the Function App deploy.

name: Deploy Backend (Azure Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

env:
  FUNCTIONS_PROJECT_PATH: ./api/RDS.ExpenseTracker.Functions/RDS.ExpenseTracker.Functions.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        run: dotnet build ./api/RDS.ExpenseTracker.sln --configuration Release

      - name: Publish Functions project
        run: dotnet publish ${{ env.FUNCTIONS_PROJECT_PATH }} --configuration Release --output "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: functions-app
          path: ${{ github.workspace }}/publish
          include-hidden-files: true # keeps the .azurefunctions folder generated by the worker SDK

  # Schema first: the new code may depend on migrations added in the same push.
  migrate:
    uses: ./.github/workflows/deploy-database.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: production
    permissions:
      id-token: write # OIDC login
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: functions-app
          path: ${{ github.workspace }}/publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read infrastructure outputs
        id: infra
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          name=$(az deployment group list -g "$AZURE_RESOURCE_GROUP" \
            --query "[?starts_with(name,'infra-') && properties.provisioningState=='Succeeded'] | sort_by(@, &properties.timestamp)[-1].properties.outputs.functionAppName.value" -o tsv)
          test -n "$name" || { echo "::error::No successful infrastructure deploy found in $AZURE_RESOURCE_GROUP"; exit 1; }
          echo "functionAppName=$name" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.functionAppName }}
          sku: flexconsumption # Flex Consumption plan: One Deploy, no slots
          package: ${{ github.workspace }}/publish
