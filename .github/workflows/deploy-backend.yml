# Docs for the Azure Functions action: https://github.com/Azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Required repository configuration:
#   secrets: AZUREAPPSERVICE_PUBLISHPROFILE_* (publish profile of the Function App, created by Azure Deployment Center)
#   vars (optional): AZURE_FUNCTIONAPP_NAME (Function App name, defaults to ExpenseTracker-Functions)
#   vars (optional, to sync platform CORS on deploy): AZURE_RESOURCE_GROUP, FE_URL
#     + secrets AZUREAPPSERVICE_CLIENTID_*, AZUREAPPSERVICE_TENANTID_*, AZUREAPPSERVICE_SUBSCRIPTIONID_* (OIDC login for az CLI)

name: Deploy Backend (Azure Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME || 'ExpenseTracker-Functions' }}
  AZURE_FUNCTIONAPP_SLOT: 'Production'
  FUNCTIONS_PROJECT_PATH: ./api/RDS.ExpenseTracker.Functions/RDS.ExpenseTracker.Functions.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        run: dotnet build ./api/RDS.ExpenseTracker.sln --configuration Release

      - name: Publish Functions project
        run: dotnet publish ${{ env.FUNCTIONS_PROJECT_PATH }} --configuration Release --output "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: functions-app
          path: ${{ github.workspace }}/publish
          include-hidden-files: true # keeps the .azurefunctions folder generated by the worker SDK

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT (OIDC login, CORS sync only)
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: functions-app
          path: ${{ github.workspace }}/publish

      - name: Login to Azure
        if: ${{ vars.AZURE_RESOURCE_GROUP != '' && vars.FE_URL != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_342688A107224B0E99571B02D9FA91AF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_555D93CEFB8249E0981014734ED112E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_950642272ECC4A549CD46B25BE7E737C }}

      - name: Sync CORS allowed origin
        if: ${{ vars.AZURE_RESOURCE_GROUP != '' && vars.FE_URL != '' }}
        shell: bash
        run: |
          existing=$(az functionapp cors show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "allowedOrigins" -o tsv)
          if ! grep -qxF "${{ vars.FE_URL }}" <<< "$existing"; then
            az functionapp cors add --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --allowed-origins "${{ vars.FE_URL }}"
          fi

      - name: Deploy to Azure Functions
        id: deploy-to-functionapp
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: ${{ env.AZURE_FUNCTIONAPP_SLOT }}
          package: ${{ github.workspace }}/publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_329BA85C08F947248EE90BF122772B77 }}
