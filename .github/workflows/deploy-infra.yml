# Deploys the Azure infrastructure described in infra/ (Bicep) to a resource group.
#
#   pull_request -> validate + what-if (preview of the changes, shown in the job summary)
#   push to main / workflow_dispatch -> validate + what-if + deploy (GitHub environment "production")
#
# The deployment identity and its permissions are created once by infra/bootstrap (run locally by an admin).
# Required configuration in the GitHub environment "production" (see infra/README.md); all jobs reference it,
# so required reviewers on the environment also gate the what-if of pull requests:
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (outputs of infra/bootstrap, OIDC login)
#            DEMO_AUTH_SIGNING_KEY (optional, written to Key Vault when set)
#   vars:    AZURE_RESOURCE_GROUP (resource group created by infra/bootstrap),
#            SQL_SERVER_NAME, SQL_DATABASE_NAME (existing SQL server/database),
#            SQL_SERVER_RESOURCE_GROUP (optional, default AZURE_RESOURCE_GROUP),
#            DEMO_AUTH_ENABLED (optional, default false),
#            CUSTOM_DOMAIN (optional, custom domain of the Static Web App, e.g. www.expensetracker.lol),
#            ONEDRIVE_IMPORT_ENABLED (optional, default false), ONEDRIVE_TARGET_USER_EMAIL (OneDrive import)

name: Deploy Infrastructure (Bicep)

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

concurrency:
  # Never run two deployments against the same resource group at the same time.
  group: deploy-infra-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEMPLATE_FILE: infra/main.bicep
  PARAMETERS_FILE: infra/parameters/prod.bicepparam

jobs:
  validate:
    name: Validate (bicep build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Variables and secrets live in the "production" environment: every job that reads them must reference it.
    environment: production
    permissions:
      contents: read
    env: &infra-env
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      # Read by infra/parameters/prod.bicepparam through readEnvironmentVariable().
      SQL_SERVER_NAME: ${{ vars.SQL_SERVER_NAME }}
      SQL_DATABASE_NAME: ${{ vars.SQL_DATABASE_NAME }}
      SQL_SERVER_RESOURCE_GROUP: ${{ vars.SQL_SERVER_RESOURCE_GROUP }}
      DEMO_AUTH_ENABLED: ${{ vars.DEMO_AUTH_ENABLED || 'false' }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      ONEDRIVE_IMPORT_ENABLED: ${{ vars.ONEDRIVE_IMPORT_ENABLED || 'false' }}
      ONEDRIVE_TARGET_USER_EMAIL: ${{ vars.ONEDRIVE_TARGET_USER_EMAIL }}
      DEMO_AUTH_SIGNING_KEY: ${{ secrets.DEMO_AUTH_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Check required configuration
        shell: bash
        run: |
          missing=0
          for v in AZURE_RESOURCE_GROUP SQL_SERVER_NAME SQL_DATABASE_NAME; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository variable: $v"; missing=1; fi
          done
          exit $missing

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build and lint template
        run: |
          az bicep build --file "$TEMPLATE_FILE" --stdout > /dev/null
          az bicep lint --file "$TEMPLATE_FILE"

      - name: Build parameters
        run: az bicep build-params --file "$PARAMETERS_FILE" --stdout > /dev/null

  what-if:
    name: What-if
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    environment: production # OIDC subject repo:<repo>:environment:production
    permissions:
      id-token: write # OIDC login
      contents: read
    env: *infra-env
    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if
        shell: bash
        # Microsoft Graph resources (app registrations) are not evaluated by what-if: only Azure resources are previewed.
        run: |
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "infra-whatif-${GITHUB_RUN_NUMBER}" \
            --parameters "$PARAMETERS_FILE" | tee whatif.txt
          {
            echo "## What-if ($AZURE_RESOURCE_GROUP)"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' whatif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: what-if
    timeout-minutes: 45
    environment: production
    permissions:
      id-token: write # OIDC login
      contents: read
    env: *infra-env
    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        shell: bash
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "infra-${GITHUB_RUN_NUMBER}" \
            --parameters "$PARAMETERS_FILE" \
            --query properties.outputs --output json > outputs.json
          {
            echo "## Deployment outputs"
            echo '| Output | Value |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"' outputs.json
            echo
            echo "deploy-backend.yml and deploy-frontend.yml read these outputs directly: nothing to copy."
            if [ -n "$CUSTOM_DOMAIN" ]; then
              echo
              echo "### DNS for $CUSTOM_DOMAIN"
              echo '```'
              # Host relative to the zone (assumes a two-label zone such as example.com): "@" for the apex, else e.g. "www".
              host=$(echo "$CUSTOM_DOMAIN" | awk -F. 'NF<=2 {print "@"; next} {NF-=2; OFS="."; $1=$1; print}')
              target=$(jq -r '.staticWebAppDefaultHostname.value' outputs.json)
              token=$(jq -r '.customDomainValidationToken.value' outputs.json)
              if [ "$host" = "@" ]; then echo "ALIAS @  $target"; else echo "CNAME $host  $target"; fi
              if [ -n "$token" ]; then
                if [ "$host" = "@" ]; then echo "TXT   _dnsauth  $token"; else echo "TXT   _dnsauth.$host  $token"; fi
              else
                echo "(domain already validated: no TXT record needed)"
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
