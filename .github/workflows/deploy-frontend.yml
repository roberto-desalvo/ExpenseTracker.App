name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build and Deploy Job
    permissions:
      contents: read
    env:
      VITE_EXPENSE_TRACKER_API_BASE_URL: ${{ secrets.VITE_EXPENSE_TRACKER_API_BASE_URL }}
      VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
      VITE_MSAL_TENANT_ID: ${{ secrets.VITE_MSAL_TENANT_ID }}
      VITE_MSAL_API_SCOPE: ${{ secrets.VITE_MSAL_API_SCOPE }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Validate frontend env vars
        shell: bash
        run: |
          test -n "$VITE_EXPENSE_TRACKER_API_BASE_URL" || (echo "Missing required environment variable: VITE_EXPENSE_TRACKER_API_BASE_URL" && exit 1)
          test -n "$VITE_MSAL_CLIENT_ID" || (echo "Missing required environment variable: VITE_MSAL_CLIENT_ID" && exit 1)
          test -n "$VITE_MSAL_TENANT_ID" || (echo "Missing required environment variable: VITE_MSAL_TENANT_ID" && exit 1)
          test -n "$VITE_MSAL_API_SCOPE" || (echo "Missing required environment variable: VITE_MSAL_API_SCOPE" && exit 1)
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_ISLAND_04AE49A03 }}
          action: "upload"
          app_location: "app"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_ISLAND_04AE49A03 }}
          action: "close"
          app_location: "app"
