name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  # On a merged PR's "closed" event github.ref is the base branch (refs/heads/main), so keying
  # only on github.ref made that run cancel the push-to-main deploy. Key PRs by number instead,
  # and never cancel an in-progress production deploy.
  group: deploy-frontend-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build and Deploy Job
    permissions:
      contents: read
    env:
      VITE_EXPENSE_TRACKER_API_BASE_URL: ${{ secrets.VITE_EXPENSE_TRACKER_API_BASE_URL }}
      VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
      VITE_MSAL_TENANT_ID: ${{ secrets.VITE_MSAL_TENANT_ID }}
      VITE_MSAL_API_SCOPE: ${{ secrets.VITE_MSAL_API_SCOPE }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Validate frontend env vars
        shell: bash
        run: |
          test -n "$VITE_EXPENSE_TRACKER_API_BASE_URL" || (echo "Missing required environment variable: VITE_EXPENSE_TRACKER_API_BASE_URL" && exit 1)
          test -n "$VITE_MSAL_CLIENT_ID" || (echo "Missing required environment variable: VITE_MSAL_CLIENT_ID" && exit 1)
          test -n "$VITE_MSAL_TENANT_ID" || (echo "Missing required environment variable: VITE_MSAL_TENANT_ID" && exit 1)
          test -n "$VITE_MSAL_API_SCOPE" || (echo "Missing required environment variable: VITE_MSAL_API_SCOPE" && exit 1)
          [[ "$VITE_EXPENSE_TRACKER_API_BASE_URL" =~ ^https:// ]] || (echo "VITE_EXPENSE_TRACKER_API_BASE_URL must start with https://" && exit 1)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build (Angular)
        working-directory: web
        # prebuild genera src/environments/env.generated.ts dalle variabili VITE_* del job
        run: npm run build
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_ISLAND_04AE49A03 }}
          action: "upload"
          # build già eseguita sopra: si carica direttamente l'output di ng build
          app_location: "web/dist/web/browser"
          api_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_ISLAND_04AE49A03 }}
          action: "close"
          app_location: "web/dist/web/browser"
