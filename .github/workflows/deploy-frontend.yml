# No app-specific configuration: the jobs log in with the same OIDC identity as deploy-infra.yml
# (environment "production": secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID, variable
# AZURE_RESOURCE_GROUP) and read from the last infrastructure deploy the VITE_* build values and the
# Static Web App, whose deployment token is fetched at run time.

name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  # On a merged PR's "closed" event github.ref is the base branch (refs/heads/main), so keying
  # only on github.ref made that run cancel the push-to-main deploy. Key PRs by number instead,
  # and never cancel an in-progress production deploy.
  group: deploy-frontend-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build and Deploy Job
    environment: production
    permissions:
      id-token: write # OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read infrastructure outputs
        id: infra
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        # Exports the VITE_* build values (read by scripts/write-env.mjs) and fetches the Static Web App deployment token.
        run: |
          az deployment group list -g "$AZURE_RESOURCE_GROUP" --query "[?starts_with(name,'infra-') && properties.provisioningState=='Succeeded'] | sort_by(@, &properties.timestamp)[-1].properties.outputs" -o json > outputs.json
          test -n "$(jq -r '.functionAppUrl.value // empty' outputs.json)" || { echo "::error::No successful infrastructure deploy found in $AZURE_RESOURCE_GROUP"; exit 1; }
          {
            echo "VITE_EXPENSE_TRACKER_API_BASE_URL=$(jq -r .functionAppUrl.value outputs.json)"
            echo "VITE_MSAL_CLIENT_ID=$(jq -r .spaClientId.value outputs.json)"
            echo "VITE_MSAL_TENANT_ID=$(jq -r .tenantId.value outputs.json)"
            echo "VITE_MSAL_API_SCOPE=$(jq -r .apiScope.value outputs.json)"
          } >> "$GITHUB_ENV"
          token=$(az staticwebapp secrets list -g "$AZURE_RESOURCE_GROUP" -n "$(jq -r .staticWebAppName.value outputs.json)" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "swaToken=$token" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build (Angular)
        working-directory: web
        # prebuild genera src/environments/env.generated.ts dalle variabili VITE_* del job
        run: npm run build
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.infra.outputs.swaToken }}
          action: "upload"
          # build già eseguita sopra: si carica direttamente l'output di ng build
          app_location: "web/dist/web/browser"
          api_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Close Pull Request Job
    environment: production
    permissions:
      id-token: write # OIDC login
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read Static Web App deployment token
        id: infra
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          swa=$(az deployment group list -g "$AZURE_RESOURCE_GROUP" --query "[?starts_with(name,'infra-') && properties.provisioningState=='Succeeded'] | sort_by(@, &properties.timestamp)[-1].properties.outputs.staticWebAppName.value" -o tsv)
          token=$(az staticwebapp secrets list -g "$AZURE_RESOURCE_GROUP" -n "$swa" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "swaToken=$token" >> "$GITHUB_OUTPUT"
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.infra.outputs.swaToken }}
          action: "close"
          app_location: "web/dist/web/browser"
