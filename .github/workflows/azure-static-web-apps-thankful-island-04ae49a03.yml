name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Load frontend env vars from Static Web App
        shell: bash
        run: |
          SWA_NAME="thankful-island-04ae49a03"

          RESOURCE_GROUP=$(az staticwebapp list --query "[?name=='${SWA_NAME}'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "No matching Static Web App found: ${SWA_NAME}"
            exit 1
          fi

          APP_SETTINGS_JSON=$(az staticwebapp appsettings list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" -o json)

          echo "VITE_EXPENSE_TRACKER_API_BASE_URL=$(echo "$APP_SETTINGS_JSON" | jq -r '.properties.VITE_EXPENSE_TRACKER_API_BASE_URL // empty')" >> "$GITHUB_ENV"
          echo "VITE_MSAL_CLIENT_ID=$(echo "$APP_SETTINGS_JSON" | jq -r '.properties.VITE_MSAL_CLIENT_ID // empty')" >> "$GITHUB_ENV"
          echo "VITE_MSAL_TENANT_ID=$(echo "$APP_SETTINGS_JSON" | jq -r '.properties.VITE_MSAL_TENANT_ID // empty')" >> "$GITHUB_ENV"
          echo "VITE_MSAL_API_SCOPE=$(echo "$APP_SETTINGS_JSON" | jq -r '.properties.VITE_MSAL_API_SCOPE // empty')" >> "$GITHUB_ENV"
      - name: Validate frontend env vars
        shell: bash
        run: |
          test -n "$VITE_EXPENSE_TRACKER_API_BASE_URL" || (echo "Missing required environment variable: VITE_EXPENSE_TRACKER_API_BASE_URL" && exit 1)
          test -n "$VITE_MSAL_CLIENT_ID" || (echo "Missing required environment variable: VITE_MSAL_CLIENT_ID" && exit 1)
          test -n "$VITE_MSAL_TENANT_ID" || (echo "Missing required environment variable: VITE_MSAL_TENANT_ID" && exit 1)
          test -n "$VITE_MSAL_API_SCOPE" || (echo "Missing required environment variable: VITE_MSAL_API_SCOPE" && exit 1)
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_EXPENSE_TRACKER_API_BASE_URL: ${{ env.VITE_EXPENSE_TRACKER_API_BASE_URL }}
          VITE_MSAL_CLIENT_ID: ${{ env.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ env.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_API_SCOPE: ${{ env.VITE_MSAL_API_SCOPE }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_ISLAND_04AE49A03 }}
          action: "upload"
          app_location: "app"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_ISLAND_04AE49A03 }}
          action: "close"
          app_location: "app"
